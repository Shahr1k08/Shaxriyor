<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#05010d;
overflow:hidden;
padding:20px;
color:white;
}

.bg1{
position:fixed;
width:500px;
height:500px;
background:#7b2cff;
filter:blur(140px);
opacity:0.35;
top:-150px;
left:-150px;
}

.bg2{
position:fixed;
width:450px;
height:450px;
background:#00aeff;
filter:blur(140px);
opacity:0.25;
bottom:-150px;
right:-150px;
}

.card{
width:100%;
max-width:430px;
background:rgba(14,10,30,0.78);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
padding:32px 28px;
border-radius:35px;
position:relative;
z-index:2;
box-shadow:
0 0 40px rgba(123,44,255,0.25),
0 0 60px rgba(0,174,255,0.12);
}

h1{
text-align:center;
font-size:52px;
font-weight:700;
background:linear-gradient(90deg,#b56dff,#4dcfff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
letter-spacing:1px;
}

.bio{
text-align:center;
margin-top:12px;
font-size:14px;
color:#9ea7d8;
}

.line{
height:1px;
background:rgba(255,255,255,0.08);
margin:28px 0;
}

.btn{
display:flex;
align-items:center;
gap:15px;
padding:19px 20px;
margin-top:17px;
border-radius:22px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.05);
text-decoration:none;
color:white;
font-size:18px;
transition:0.35s;
}

.btn:hover{
transform:translateY(-3px);
background:rgba(255,255,255,0.08);
box-shadow:
0 0 18px rgba(123,44,255,0.35),
0 0 25px rgba(0,174,255,0.2);
}

.icon{
font-size:22px;
}

.footer{
text-align:center;
margin-top:24px;
font-size:13px;
color:#7278a8;
}

</style>
</head>

<body>

<div class="bg1"></div>
