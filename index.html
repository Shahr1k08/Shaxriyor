<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You - Zulfiya</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050505;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* Yulduzli fon uchun */
        canvas#bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Asosiy konteyner */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        /* Konvert / Kartochka dizayni */
        .card {
            background: rgba(20, 20, 20, 0.8);
            border: 2px solid #e056fd;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(224, 86, 253, 0.4);
            backdrop-filter: blur(5px);
            transition: all 0.5s ease;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            color: #ff7675;
        }

        .heart {
            font-size: 3rem;
            color: #ff7675;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Tugma */
        button {
            background: transparent;
            border: 2px solid #ff7675;
            color: white;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        button:hover {
            background: #ff7675;
            box-shadow: 0 0 15px #ff7675;
        }

        /* Ism chiqadigan qism */
        #display-text {
            display: none;
            font-size: 3.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff7675, #e056fd, #74b9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(224, 86, 253, 0.6);
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <!-- Fon uchun canvas -->
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <div class="card" id="card-box">
            <div class="heart">❤️</div>
            <h1>FOR YOU</h1>
            <button onclick="startAnimation()">Ko'rish uchun bosing</button>
        </div>
        <div id="display-text">Zulfiya</div>
    </div>

    <script>
        // Yulduzli fon animatsiyasi
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const stars = [];
        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // Tugma bosilgandagi amal
        function startAnimation() {
            const cardBox = document.getElementById('card-box');
            const displayText = document.getElementById('display-text');

            // Konvert yo'qoladi
            cardBox.style.transform = 'scale(0)';
            cardBox.style.opacity = '0';

            setTimeout(() => {
                cardBox.style.display = 'none';
                // Ism chiqib keladi
                displayText.style.display = 'block';
                displayText.style.animation = 'fadeIn 2s ease-in-out';
            }, 500);
        }
    </script>
</body>
</html>
